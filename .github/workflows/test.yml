name: test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # A commit merged from a pull request was already tested on that PR; direct pushes are still tested.
    if: github.event_name != 'push' || !(contains(github.event.head_commit.message, '(#') || startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
